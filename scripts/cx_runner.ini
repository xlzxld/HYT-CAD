; ============================================================================
; cx_runner 参数默认值配置(出线槽)
; ============================================================================
; 使用说明:
;   * 记事本直接改数值, 保存后下次打开参数窗口立即生效(无需重启CAD)
;   * 参数窗口的「恢复默认」按钮 = 恢复为本文件的值
;   * 删除本文件 = 回到代码内置默认(下次运行自动重新生成)
;   * 上次在参数窗口里填的值记录在 cx_runner_mem.ini(程序自动维护,
;     记忆值优先于本文件)
;   * 保存时请保持 ANSI 编码(勿改存 UTF-8, 否则配置静默失效回退默认)
; ============================================================================

[参数]
; 出线槽偏移: CX 源线向两侧各偏移该值形成通道壁(即通道半宽)
cx_dist = 17.5000
; 出线槽延长: 悬空端头沿切线固定延长的距离(用于让相邻通道的壁相交)
cx_extend = 50.0000
; 出线槽小圆角R: 通道壁相交断口处的圆角半径(空间不足时内部自动递减)
cx_fillet_r_small = 15.0000
; 出线槽大圆角R: 延长交会处的圆角半径(空间不足时内部自动递减)
cx_fillet_r_large = 30.0000
; 压线板间距: 沿出线槽侧壁每隔该值放置一幅压线板(100~150)
cx_yxb_gap = 125.0000
