; ============================================================================
; flb_runner 参数默认值配置(分流板)
; ============================================================================
; 使用说明:
;   * 记事本直接改数值, 保存后下次打开模板/参数窗口立即生效(无需重启CAD)
;   * 参数窗口的「恢复默认」按钮 = 恢复为本文件的值
;   * 删除本文件 = 回到代码内置默认(下次运行自动重新生成)
;   * 上次在参数窗口里填的值记录在 flb_runner_mem.ini(程序自动维护,
;     记忆值优先于本文件; 想忘掉记忆就删 mem 文件)
;   * 注意: 保存时请保持 ANSI 编码(记事本默认即为 ANSI, 勿改存 UTF-8,
;     否则中文节名会匹配失败, 配置静默失效回退默认)
; 分节规则: [通用]/[矩形] 两套模板各一套默认值, 只列该模板用到的参数;
;           [假体] 节是全局开关, 与模板无关
; ============================================================================

[通用]
; 分流板偏移距离: 流道中心线向两侧各偏移该值形成红色 FLB 轮廓(即通道半宽+让位)
offset_dist = 35.0000
; 假体偏移距离: 假体(JT)轮廓距流道中心线的距离, 决定假体大小(需大于 offset_dist)
hole_dist = 50.0000
; 假体端头延长: 假体封闭线端头向外延长量(仅传统逐步假体流程使用)
hole_extend = 15.0000
; 分流板圆角R: FLB 通道断口处的圆角半径(空间不足时内部自动递减)
fillet_r = 15.0000
; 假体圆角R: 假体断口与假体封口线的圆角半径
fillet_r_hole = 15.0000
; 封口倒角距离: 通道封口端部两侧的 45 度倒角距离
chamfer_d = 5.0000
; 螺丝孔内偏: 螺丝孔中心沿通道向内偏移封口线的距离
screw_in = 10.0000
; 螺丝孔R: 螺丝孔圆半径(青色 LS 层)
screw_r = 4.2500
; 热咀偏移: 热咀圆心沿通道向内距封口线的距离
nozzle_offset = 40.0000
; 热咀半径R: 热咀圆半径(橙色 RZ 层)
nozzle_r = 11.3500
; 点孔半径R: 与热咀同心的点孔圆半径, 设 0 = 不画点孔
pin_r = 3.0000
; 主进胶R: 主进胶圆半径(DP圆心画圆)
zjj_r = 14.3500

[矩形]
; 矩形模板: LD 范围向外扩 offset_dist 画矩形板边, 四角 rect_chamfer 倒角,
; 假体 = 圆角矩形; 只列该模板用到的参数
offset_dist = 35.0000
hole_dist = 50.0000
fillet_r_hole = 15.0000
screw_in = 15.0000
screw_r = 4.2500
nozzle_r = 11.3500
pin_r = 3.0000
; 板角倒角: 矩形板边四角的 45 度倒角距离
rect_chamfer = 10.0000

[假体]
; 假体绘制方式: 0=传统逐步(默认, LD偏移+裁剪+封口, 与参数框勾选框联动)
;              1=包络法(FLB包络盒外扩整体圆角矩形, 适合对头相接类布局)
; 改这里 = 改默认值; 参数框勾选后点确定 = 本次记忆(优先于本文件)
envelope = 0
