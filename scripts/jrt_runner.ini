; ============================================================================
; jrt_runner 参数默认值配置(加热条)
; ============================================================================
; 使用说明:
;   * 记事本直接改数值, 保存后下次打开模板/参数窗口立即生效(无需重启CAD)
;   * 参数窗口的「恢复默认」按钮 = 恢复为本文件的值
;   * 删除本文件 = 回到代码内置默认(下次运行自动重新生成)
;   * 上次填的值在 jrt_runner_mem.ini(程序自动维护, 记忆值优先于本文件)
;   * 保存时请保持 ANSI 编码(勿改存 UTF-8, 否则配置静默失效回退默认)
; 分节规则: [通用一] = LD 源线 + RZ 热咀的标准做法;
;           [通用二] = JRT 源线 + JRTDW 定位线的两点式做法
; ============================================================================

[通用一]
; 流道线偏移距离: 加热条单侧宽度(半宽), 从 LD 中心线向两侧偏移
jrt_offset = 29.0000
; 封闭线内偏移距离: 直线端帽封闭线向通道内偏移的距离
jrt_cap_inset = 11.0000
; 圆角半径R: 加热条交汇断口的圆角半径(内层逐层递增, 与外层同心)
jrt_fillet_r = 19.0000
; 封闭线圆角半径R: 封闭线端部圆角, 大于等于半宽时为相切圆弧
jrt_cap_r = 29.0000
; 向内偏移步长: 相邻内层轮廓之间的间距
jrt_inner_step = 4.0000
; 内向偏移次数: 内层层数 = 该次数 + 1(含最外层)
jrt_inner_count = 2.0000

[通用二]
; 通用二(JRT源线+JRTDW定位线)只用到下列参数:
; 出线口通道半宽: JRTDW 定位短线朝两边偏移此值, 得出线通道两壁线
jrt2_half_w = 16.5000
; 出线口过渡圆角R: 外壁断头与通道线的过渡弧半径(与手画 FILLET 一致)
jrt2_end_r = 12.0000
jrt_inner_step = 4.0000
jrt_inner_count = 2.0000
; 出线颈线长度: 出线口颈部线段的长度
jrt2_neck_len = 65.0000
; 出线颈线偏移: 颈线相对定位线的偏移距离
jrt2_neck_off = 35.0000
; 出线封口圆角R: 出线口封口处的圆角半径
jrt2_close_r = 15.0000
; 出线相交圆角R: 出线口与相交线的圆角半径
jrt2_trim_r = 15.0000
;
; 出线口通道延伸: 通道线双端各加长量, 圆弧/圆外壁让开时保证够得着外壁; 0=旧行为
jrt2_hook_ext = 5.0000
